openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: yard
    description: Yard analysis
  - name: plan
    description: Lawn plan generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze-yard:
    post:
      operationId: analyzeYard
      tags: [yard]
      summary: Analyze a yard description
      description: >
        Uses a small AI model to pick out current yard problems and goals from the
        user's descriptions. Falls back to the keyword matcher if the AI is unavailable.
        Descriptions longer than 1,000 characters are truncated. Limited to 30 requests
        per hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YardInput"
      responses:
        "200":
          description: Yard analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YardAnalysis"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate-plan:
    post:
      operationId: generatePlan
      tags: [plan]
      summary: Write a 4-6 week lawn plan
      description: >
        Uses a small AI model to write a plan from the confirmed issues, goals, today's
        date, and the lawn guide's numbers for the grass type. Falls back to the basic
        rule-based plan if the AI is unavailable or its plan breaks the rules.
        Limited to 30 requests per hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Lawn plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LawnPlan"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    YardInput:
      type: object
      properties:
        zip:
          type: string
          pattern: "^[0-9]{5}$"
        grassType:
          type: string
          minLength: 1
        currentDescription:
          type: string
          minLength: 1
        desiredDescription:
          type: string
          minLength: 1
      required: [zip, grassType, currentDescription, desiredDescription]
    YardIssue:
      type: object
      properties:
        key:
          type: string
          enum: [bare, weeds, dry, thin, shade]
        status:
          type: string
          enum: [present, absent, unclear]
        evidence:
          type: string
        severity:
          type: string
          enum: [low, medium, high]
      required: [key, status, evidence, severity]
    YardAnalysis:
      type: object
      properties:
        source:
          type: string
          enum: [ai, fallback]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/YardIssue"
        goals:
          type: array
          items:
            type: string
        otherConcerns:
          type: array
          items:
            type: string
      required: [source, issues, goals, otherConcerns]
    ConfirmedIssue:
      type: object
      properties:
        key:
          type: string
          enum: [bare, weeds, dry, thin, shade]
        evidence:
          type: string
      required: [key, evidence]
    PlanInput:
      type: object
      properties:
        zip:
          type: string
          pattern: "^[0-9]{5}$"
        region:
          type: string
          minLength: 1
          description: Region name from the lawn guide; must match the ZIP's region.
        grassType:
          type: string
          minLength: 1
          description: Grass type key from the lawn guide.
        confirmedIssues:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmedIssue"
        goals:
          type: array
          items:
            type: string
        today:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The user's local date, YYYY-MM-DD.
      required: [zip, region, grassType, confirmedIssues, goals, today]
    PlanWeek:
      type: object
      properties:
        week:
          type: integer
        title:
          type: string
        mow:
          type: string
        water:
          type: string
        fertilize:
          type: string
        extra:
          type: array
          items:
            type: string
        why:
          type: string
          description: One sentence explaining the week. Absent in the rule-based plan.
      required: [week, title, mow, water, fertilize, extra]
    LawnPlan:
      type: object
      properties:
        source:
          type: string
          enum: [ai, fallback]
        summary:
          type: string
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/PlanWeek"
      required: [source, summary, weeks]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

